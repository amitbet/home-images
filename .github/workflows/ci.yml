name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Package optional native JPEG codec
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-turbojpeg.ps1
          go build -o dist/native-jpeg-test.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Native worker test build failed' }
          "HOMEIMAGES_TEST_PREVIEW_EXE=$((Resolve-Path dist/native-jpeg-test.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HOMEIMAGES_TEST_TURBO_DLL=$((Resolve-Path dist/turbojpeg.dll).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: go test -count=1 ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Native daemon lifecycle smoke test
        shell: pwsh
        run: ./scripts/test-daemon.ps1
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build standalone binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o "dist/home-images-$GOOS-$GOARCH$suffix" .
      - uses: actions/upload-artifact@v4
        with:
          name: home-images-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  accelerated-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: pwsh
        run: |
          ./scripts/package-turbojpeg.ps1
          go build -trimpath -ldflags "-s -w -X main.version=$env:GITHUB_SHA" -o dist/home-images-windows-amd64.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: home-images-windows-amd64-accelerated
          path: |
            dist/home-images-windows-amd64.exe
            dist/turbojpeg.dll
            dist/turbojpeg-licenses/
